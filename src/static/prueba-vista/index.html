<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Prueba visual · BSL</title>
  <style>
    body { margin: 0; background: #131417; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    .demo { max-width: 460px; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; gap: 14px; }
    .demo h1 { font-size: 1.4rem; font-weight: 500; margin: 0; }
    .demo p { color: rgba(255,255,255,.72); line-height: 1.45; margin: 0; }
    .demo button { min-height: 50px; border: none; border-radius: 10px; background: #0b5cff; color: #fff; font: inherit; font-size: 1rem; font-weight: 500; }
    .demo-resultado { background: #1c1e24; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .demo-resultado h2 { margin: 0; font-size: 1.1rem; font-weight: 500; }
    .demo-resultado li { color: rgba(255,255,255,.8); font-size: .9rem; }
    .demo pre { max-height: 300px; overflow: auto; font-size: 10px; background: rgba(255,255,255,.04); padding: 10px; border-radius: 8px; }
    /* Resultados de la pupilometría: los mismos estilos que en el avatar (avatar.css) */
    .vc-ojos-resultados {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .vc-ojos-resultados[hidden] { display: none; }
    .vc-ojos-titulo { font-size: 1.05rem; font-weight: 500; }
    .vc-ojos-fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .vc-ojos-fotos figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
    .vc-ojos-fotos img { width: 100%; height: auto; border-radius: 6px; background: #000; display: block; }
    .vc-ojos-fotos figcaption { font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); text-align: center; }
    .vc-ojos-estudio h4 { font-size: 0.92rem; font-weight: 500; margin-bottom: 6px; color: #8fb6ff; }
    .vc-ojos-fila {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 0.85rem;
    }
    .vc-ojos-medida { display: flex; flex-wrap: wrap; column-gap: 4px; min-width: 0; }
    .vc-ojos-medida small { flex-basis: 100%; font-size: 0.72rem; color: rgba(255, 255, 255, 0.5); line-height: 1.35; }
    .vc-ojos-exp { font-size: 0.72rem; color: #d29922; }
    .vc-ojos-valor { flex: none; font-variant-numeric: tabular-nums; text-align: right; }
    .vc-ojos-bandera { font-size: 0.8rem; line-height: 1.4; margin-top: 6px; }
    .vc-ojos-bandera.ok { color: #6fd39b; }
    .vc-ojos-bandera.alerta { color: #e7b55a; }
    .demo-resultado[hidden] { display: none; }
    .demo .vc-ojos-resultados { margin-top: 0; border-top: none; }
  </style>
</head>
<!-- La prueba visual (static/js/vista.js) y la pupilometría (static/js/ojos.js) seguidas, sin la visiometría. No guarda nada. -->
<body>
  <main class="demo" id="demo">
    <h1>Prueba visual</h1>
    <p>Página de prueba de la visiometría guiada: agudeza de cerca por cada ojo, reloj de astigmatismo y colores, y enseguida la pupilometría. No guarda nada.</p>
    <p>Necesitas la cámara y el volumen arriba. Si usas gafas, tenlas a mano.</p>
    <button type="button" id="empezar">Empezar</button>
    <section class="demo-resultado" id="resultado" hidden></section>
    <section class="demo-resultado vc-ojos-resultados" id="resultado-ojos" hidden></section>
  </main>
  <script type="module" src="demo.js"></script>
</body>
</html>
