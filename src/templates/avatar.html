<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Asistente Médico BSL</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/avatar.css') }}">
</head>

<body class="avatar-page">
    <!-- Videollamada: el paciente se ve a si mismo a pantalla completa y el doctor va en un
         circulo en la esquina -->
    <main class="vc" id="vc" data-estado="inicio">
        <div class="vc-escenario">
            <div class="vc-ficha vc-ficha-doctor" id="doctorBubble" aria-label="Video del médico">
                <video id="avatarVideo" autoplay playsinline></video>
                <span class="vc-nombre">Médico BSL</span>
            </div>

            <div class="vc-ficha vc-ficha-self">
                <video id="selfVideo" class="vc-self" autoplay playsinline muted aria-label="Tu cámara"></video>
                <span class="vc-sin-camara" aria-hidden="true">Cámara apagada</span>
                <span class="vc-nombre">Tú</span>
            </div>
        </div>

        <div class="vc-shade" aria-hidden="true"></div>

        <div class="vc-inicio">
            <div class="vc-tarjeta">
                <div class="vc-previa">
                    <span class="vc-monograma" aria-hidden="true">BSL</span>
                    <span class="vc-previa-texto">El médico se conecta cuando entres</span>
                </div>
                <h1>Consulta de validación</h1>
                <p>Vas a hablar con el médico virtual de BSL. Activa tu cámara y tu micrófono.</p>
                <label class="vc-consentimiento">
                    <input type="checkbox" id="consentimiento">
                    <span>Acepto que la consulta se grabe en audio y que se tomen fotos de mi cámara para verificar mi identidad, según la política de tratamiento de datos de BSL.</span>
                </label>
                <button id="callButton" aria-label="Iniciar consulta con el asistente médico">Iniciar Consulta</button>
            </div>
        </div>

        <div class="vc-bar">
            <button id="audioBtn" class="vc-audio" hidden>Toca para escuchar al doctor</button>
            <div class="call-status" role="status" aria-live="polite">Listo para iniciar</div>
            <button id="endCallBtn" class="vc-hangup" aria-label="Finalizar consulta" hidden>
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.956.956 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                <span>Salir</span>
            </button>
        </div>

        <div class="vc-resumen" id="resumenCard" hidden>
            <h2 id="resumenTitulo">Consulta finalizada</h2>
            <pre id="resumen"></pre>
            <button id="reintentarBtn" class="vc-reintentar" hidden>Intentar de nuevo</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/dist/livekit-client.umd.js"></script>
    <script type="module" src="{{ url_for('static', filename='js/avatar.js') }}"></script>
</body>

</html>
