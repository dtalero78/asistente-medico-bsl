<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calling App</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <!-- Capa oscura para mejorar contraste -->
    <div class="overlay" aria-hidden="true"></div>

    <main>
        <!-- Contenedor central del botón -->
        <div class="main-container">
            <button id="callButton" aria-label="Iniciar llamada con asistente medico">Iniciar Llamada</button>
        </div>

        <!-- Caja que aparece durante la llamada -->
        <div id="ringBox" role="region" aria-label="Llamada en curso">
            <div class="ring-content">
                <div class="wave" aria-hidden="true"></div>
                <div class="wave" aria-hidden="true" style="animation-delay: 0.6s"></div>
                <div class="wave" aria-hidden="true" style="animation-delay: 1.2s"></div>
                <div class="call-status" role="status" aria-live="polite">Iniciando...</div>
                <div class="timer-wrapper">
                    <h2>Asistente Médico Virtual</h2>
                    <div class="timer" role="timer" aria-live="off"></div>
                    <div class="speak-now" aria-live="assertive">PUEDES HABLAR</div>
                </div>
                <div class="loader" role="alert" style="display: none;">Enviando resumen...</div>
                <button id="endCallBtn" aria-label="Finalizar llamada" style="display: none;">Finalizar Llamada</button>
            </div>
        </div>
    </main>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
